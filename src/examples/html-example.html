<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Omno Checkout SDK Playground</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
      body {
          font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
          padding: 24px;
          background: #f7f7f7;
      }

      button {
          margin: 6px;
          padding: 10px 16px;
          font-size: 14px;
          cursor: pointer;
      }

      #your-container-id {
          margin-top: 20px;
          width: 100%;
          height: 800px;
          border: 2px dashed #ccc;
          background: #fff;
      }
  </style>
</head>
<body>

<h1>Omno Checkout SDK – Live Test</h1>

<button id="btn-open">Open Cashier (Modal)</button>
<button id="btn-container">Open in Container</button>
<button id="btn-close">Close</button>
<button id="btn-reload">Reload</button>
<button id="btn-destroy">Destroy</button>

<hr style="margin: 16px 0;" />
<strong>Set Language:</strong>
<button data-lang="en">English (en)</button>
<button data-lang="tr">Turkish (tr)</button>
<button data-lang="de">German (de)</button>
<button data-lang="fr">French (fr)</button>
<button data-lang="es">Spanish (es)</button>

<div id="your-container-id">
  Cashier will mount here (container mode)
</div>

<!-- Your compiled JS file -->
<script type="module" src="./demo.js"></script>

</body>
</html>
