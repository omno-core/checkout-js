<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Omno Hosted Payment Fields — Demo</title>
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        max-width: 460px;
        margin: 40px auto;
        color: #1a1a2e;
      }
      h1 {
        font-size: 20px;
      }
      .field-label {
        display: block;
        font-size: 13px;
        margin: 16px 0 6px;
        font-weight: 600;
      }
      .field {
        height: 48px;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
        padding: 0 8px;
        background: #fff;
      }
      .row {
        display: flex;
        gap: 12px;
      }
      .row > div {
        flex: 1;
      }
      #pay {
        margin-top: 24px;
        width: 100%;
        height: 46px;
        border: 0;
        border-radius: 8px;
        background: #4f46e5;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      #pay:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #status {
        margin-top: 16px;
        font-size: 14px;
        min-height: 20px;
      }
      .err {
        color: #d92d20;
      }
      .ok {
        color: #027a48;
      }
    </style>
  </head>
  <body>
    <h1>Merchant custom checkout (Hosted Payment Fields)</h1>

    <label class="field-label">Cardholder name</label>
    <div id="om-cardholder" class="field"></div>

    <label class="field-label">Card number</label>
    <div id="om-card-number" class="field"></div>

    <div class="row">
      <div>
        <label class="field-label">Expiry</label>
        <div id="om-expiry" class="field"></div>
      </div>
      <div>
        <label class="field-label">CVV</label>
        <div id="om-cvv" class="field"></div>
      </div>
    </div>

    <button id="pay" disabled>Pay</button>
    <div id="status"></div>

    <script type="module" src="./hpf-demo.js"></script>
  </body>
</html>
